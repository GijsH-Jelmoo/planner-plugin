name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer:v2

      - name: Versie moet overeenkomen met de tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "^ \* Version: ${TAG}$" jelmoo-planner.php
          grep -q "JELMOO_PLANNER_VERSION = '${TAG}'" jelmoo-planner.php

      - name: Tests
        run: |
          composer install --no-interaction --no-progress
          vendor/bin/phpunit

      - name: Zip bouwen
        run: bin/build-zip.sh

      - uses: softprops/action-gh-release@v2
        with:
          files: build/jelmoo-planner.zip
          generate_release_notes: true
